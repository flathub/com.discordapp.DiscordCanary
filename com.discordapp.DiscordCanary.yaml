          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1239/discord_desktop_core/1/full.distro
        sha256: 6c095a696e341cfadb5d30bf1ae3fa8587ed38508b7d3644aa027d92dd0cdbeb
        x-checker-data:
          type: json

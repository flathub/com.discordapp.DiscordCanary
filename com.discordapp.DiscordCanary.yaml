      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1689/discord_desktop_core/1/full.distro
        sha256: 0f6b45fb6c683ea46e892494f4c86831ec358be3bf95595c0a1611dd462444f2
        x-checker-data:

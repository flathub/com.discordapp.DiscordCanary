        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1654/discord_desktop_core/1/full.distro
        sha256: 0225128e216adab039b32ac42ce99f7490584063c30833f80da6e35e90a9c51f
        x-checker-data:

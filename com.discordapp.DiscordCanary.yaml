        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1868/discord-canary-1.0.1868.tar.gz
        sha256: 797396a5688fc4da2a209b4997b92c2db0ea9d6d940f5077bc4c6a05826d054f
        x-checker-data:

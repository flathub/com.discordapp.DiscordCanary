        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1193/discord_desktop_core/1/full.distro
        sha256: be3c28230b6cd62278dd2468f9b60a58a421087cd688277f32df19db92e58b32
        x-checker-data:

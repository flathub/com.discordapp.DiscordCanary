        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1821/discord_desktop_core/1/full.distro
        sha256: cfe12f3cb59e4949a6e53da7a8976a641a108dbc0a807b58d0c7c34eb93724fc

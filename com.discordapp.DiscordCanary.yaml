      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1158/discord_desktop_core/1/full.distro
        sha256: 820df0334b5a6b1d327f7512432d15d5adbe4d5fd0de8ea6a23e01243630b229
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1627/discord_desktop_core/1/full.distro
        sha256: d9d52c8ac091423c2d0ff775ab43e23775caf1c0cd9f3bf1ce739324d71318a6
        x-checker-data:

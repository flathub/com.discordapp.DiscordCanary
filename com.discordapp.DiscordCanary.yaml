        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1307/discord_desktop_core/1/full.distro
        sha256: d0177f19a647375efbbaee56df3affa5f949256e218578a492ffce16075be701
        x-checker-data:

          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1512/discord_desktop_core/1/full.distro
        sha256: 2d41c28a6dab85780beb1a6412c4444468c072a67a3ff2aca40973fe633c2442
        x-checker-data:

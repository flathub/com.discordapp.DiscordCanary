        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1806/discord_desktop_core/1/full.distro
        sha256: fdd1c48ce8d3019c1b7a5da1ffdd7b3f8cedc20bfe03b0ed9e323d3278dabae8
        x-checker-data:

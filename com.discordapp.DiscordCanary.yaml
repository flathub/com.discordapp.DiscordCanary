        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1924/discord_desktop_core/1/full.distro
        sha256: cfc71d6106e04778bf52261b0fa5c578306657ed341ca28c60cc401395ff560c
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1445/discord_desktop_core/1/full.distro
        sha256: 10808ee5f5eb39bd9703bc23e9f5977a68d6e0ee0c98ceb6e631570651a0ac12
        x-checker-data:

          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1712/discord_desktop_core/1/full.distro
        sha256: 651455b137db7124b2ffdf1a904474910d52e60c64e5a7d91456834b24eac774
        x-checker-data:

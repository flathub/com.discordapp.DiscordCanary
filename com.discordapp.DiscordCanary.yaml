        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1923/discord_desktop_core/1/full.distro
        sha256: ee2d5878a91f4c94837d814146a0cfd81d3f7c25a280db218c540a66f102e897
        x-checker-data:

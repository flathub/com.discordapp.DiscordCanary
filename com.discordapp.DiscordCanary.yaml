        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1752/discord_desktop_core/1/full.distro
        sha256: 2190a0da6afdae45df3f5fe42918f46b544d9e7c93d679beba4b5d1525caab5d
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1405/discord_desktop_core/1/full.distro
        sha256: 8da23dd7def798cacb5b3fe2e17d6756438cb6ab1f45f7e008f9941f1597cf07
        x-checker-data:

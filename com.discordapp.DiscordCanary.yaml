      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1178/discord_desktop_core/1/full.distro
        sha256: 768d790e40892a9b47640706e217acf01343be3b28740a387af65c8b83f9c07e
        x-checker-data:

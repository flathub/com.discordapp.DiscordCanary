        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1790/discord_desktop_core/1/full.distro
        sha256: 55a3e3263c7a8b2f2035c05917618de8eee55e3b1fc759c7e50021d355c82ec8
        x-checker-data:

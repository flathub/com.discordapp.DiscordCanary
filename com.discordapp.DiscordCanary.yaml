      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1547/discord_desktop_core/1/full.distro
        sha256: 7f387c7683405faf5a348ee50c1e89238aa342973312300824293338137cda90
        x-checker-data:

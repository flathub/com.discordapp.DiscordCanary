        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1766/discord_desktop_core/1/full.distro
        sha256: 1fb99ccfbb66d85417ae66df2f3f67d5bc5bb8030d02718af625846cca15a1ec
        x-checker-data:

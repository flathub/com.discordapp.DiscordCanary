          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1581/discord_desktop_core/1/full.distro
        sha256: 4000f75dc056bc3aab5ef08053fb7a26d886c90ba50b2b7ccc6f361f129465ce
        x-checker-data:

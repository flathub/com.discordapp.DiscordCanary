        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1574/discord_desktop_core/1/full.distro
        sha256: 1659a8deddecf9ecf39b86d081d94c33ce575a0c91afccae25bedd0dc3bbd565
        x-checker-data:

          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1324/discord_desktop_core/1/full.distro
        sha256: eca54dfc04cff727962ba0b9c8c5f5f60caa7e40a424537ac71729828fa81d70
        x-checker-data:

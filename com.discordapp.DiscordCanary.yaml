      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1353/discord_desktop_core/1/full.distro
        sha256: 5deb7f989d3c82612db881fe28f31e689fc8352a7d4ec788ff52a7a031a34def
        x-checker-data:

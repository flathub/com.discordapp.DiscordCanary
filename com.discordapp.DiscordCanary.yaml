        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1858/discord-canary-1.0.1858.tar.gz
        sha256: 9d348d2af0a10070e635801ce11cdf092f26f1d101a3765c3e39cbc6423320fe
        x-checker-data:

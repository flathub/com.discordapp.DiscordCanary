        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1761/discord_desktop_core/1/full.distro
        sha256: 1327cd49d129648efae2ee3db1b7b2881b83a2f53ff3bea5406d47144729b850
        x-checker-data:

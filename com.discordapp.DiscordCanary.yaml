        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1736/discord_desktop_core/1/full.distro
        sha256: 6a6341087132b966a74dce2e29d2327446fafe1480c6747476036f50f7831f1e

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1576/discord_desktop_core/1/full.distro
        sha256: 2505053ddb63eda0642abe51f7ecfaa0bee8555d0d25b5463444e9f843bac0db
        x-checker-data:

        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1884/discord-canary-1.0.1884.tar.gz
        sha256: 7dde4bdbf2cdb843bdd6868ea69fe35ae89c3135d6de8f15c2a9adb190241bfd
        x-checker-data:

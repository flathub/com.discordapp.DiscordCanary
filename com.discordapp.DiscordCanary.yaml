      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1392/discord_desktop_core/1/full.distro
        sha256: f263c29e6e464c044319e86a1cf3cfec9f8c189b512479cef21274dfde5ff588
        x-checker-data:

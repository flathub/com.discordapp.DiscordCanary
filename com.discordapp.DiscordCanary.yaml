      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1218/discord_desktop_core/1/full.distro
        sha256: 0a23e4b072ad6da31ab2a32d63198e6a0496f17926431e0984556c17611caf05
        x-checker-data:

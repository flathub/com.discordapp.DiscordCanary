        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1451/discord_desktop_core/1/full.distro
        sha256: cc3e7cfddc25284ce351c80a03b8c39adf909b0d1a000d7d2255fee01bde5867
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1948/discord_desktop_core/1/full.distro
        sha256: 8a6ea1f8ab1326377518b135b8c89a80cd59c8a672535e50becf4ffa4c4a3b91

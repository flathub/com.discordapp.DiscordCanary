        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1361/discord_desktop_core/1/full.distro
        sha256: b85708f6c3d8c1abfffad823ed8bc9cbda1ac4f3abb5f9ab026e20fd8335ce82
        x-checker-data:

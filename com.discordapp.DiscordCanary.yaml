          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1146/discord_desktop_core/1/full.distro
        sha256: 5f8dceaf376c70c02cdb4ff8a170348805c6611a679850c7b0521fd7e8ba8909
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1834/discord_desktop_core/1/full.distro
        sha256: a07d7a3f88a187304bf4d29ae0269c1cff92ce888113daefcc21f7f05e6f9fc2
        x-checker-data:

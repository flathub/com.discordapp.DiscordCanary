        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1868/discord_desktop_core/1/full.distro
        sha256: 63bfdab6b4883b7e1ee6ef0d883ad10405dcf0ead0c8dc1ffeeb77d78b2240f1

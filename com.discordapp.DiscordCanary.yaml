        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1624/discord_desktop_core/1/full.distro
        sha256: 17549418e4a13b7979652ec9c669dbb03a05f75713b85a9a1a2e98c6e4af3068
        x-checker-data:

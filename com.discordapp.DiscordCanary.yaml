        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1744/discord-canary-1.0.1744.tar.gz
        sha256: 6d6e2f673a37c5f6194b062b2c504545f3a05cb3f5a114f5f568796055e97a41
        x-checker-data:

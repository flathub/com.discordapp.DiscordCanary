        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1838/discord_desktop_core/1/full.distro
        sha256: a2c30844c326bd6d74b8906d226bf3bc0f1d0053de2e9ffea60441ebbffa774d
        x-checker-data:

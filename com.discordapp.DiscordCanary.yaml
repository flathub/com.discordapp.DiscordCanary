      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1174/discord_desktop_core/1/full.distro
        sha256: 0eace749bc0e08d09bd963dafc08d068e85c776478e74ba0776887f0377b8bba
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1640/discord_desktop_core/1/full.distro
        sha256: 04e2dc186e92ed13681277b3fef3bc058042dc3647aa34aa7d9f0aee36730579
        x-checker-data:

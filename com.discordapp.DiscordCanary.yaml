        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1430/discord_desktop_core/1/full.distro
        sha256: 1f0e37f930f10f331e7d00d5c5adda0070b57b4456051529a0986547711638ab
        x-checker-data:

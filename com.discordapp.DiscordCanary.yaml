        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1898/discord_desktop_core/1/full.distro
        sha256: 78872c17d065f9c1bf16c2bb6e9eaac663123a3ee654314935904eefb3a5fdb2

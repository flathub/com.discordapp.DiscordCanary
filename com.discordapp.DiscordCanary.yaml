        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1708/discord_desktop_core/1/full.distro
        sha256: 2144aec550d55e038562780eed3f930edae058fd7415d6ca00fabed395e78563
        x-checker-data:

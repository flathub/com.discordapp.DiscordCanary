          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1245/discord_desktop_core/1/full.distro
        sha256: a8128a68cbec11fce49cff755eecad605024e23a0aed473b6efca8b661b6aa1a
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1635/discord_desktop_core/1/full.distro
        sha256: cd217a932297cc2111004c7c2ec946b7f6183ed597360af629da63d18c74e45d
        x-checker-data:

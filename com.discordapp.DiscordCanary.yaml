        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1651/discord_desktop_core/1/full.distro
        sha256: 52ec7640d216bf3dd821baad1ac66696d8b12848db9a523741dde49a67788ed3
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1807/discord_desktop_core/1/full.distro
        sha256: a8edd9d16fd3b9067c64864c9dbe5f61bcfc36996a1a1339f11fb66e5ccc0176

        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1791/discord-canary-1.0.1791.tar.gz
        sha256: 4b640a739b8a1e53832f255defe12fbb4dff9b465cf54aa151b197b84a755af9
        x-checker-data:

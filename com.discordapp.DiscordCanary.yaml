id: com.discordapp.DiscordCanary
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: com.discordapp.DiscordCanary
separate-locales: false
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --socket=pcsc
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --talk-name=org.freedesktop.ScreenSaver
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.indicator.application
  - --talk-name=com.canonical.Unity
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=ELECTRON_TRASH=gio

modules:
  - name: socat
    config-opts:
      - --disable-largefile
      - --disable-stats
      - --disable-stdio
      - --disable-fdnum
      - --disable-creat
      - --disable-gopen
      - --disable-pipe
      - --disable-socketpair
      - --disable-termios
      - --disable-abstract-unixsocket
      - --disable-ip6
      - --disable-rawip
      - --disable-genericsocket
      - --disable-interface
      - --disable-tcp
      - --disable-udp
      - --disable-udplite
      - --disable-sctp
      - --disable-dccp
      - --disable-vsock
      - --disable-namespaces
      - --disable-posixmq
      - --disable-socks4
      - --disable-socks4a
      - --disable-socks5
      - --disable-proxy
      - --disable-exec
      - --disable-system
      - --disable-shell
      - --disable-pty
      - --disable-fs
      - --disable-readline
      - --disable-openssl
      - --disable-tun
      - --disable-sycls
      - --disable-filan
      - --disable-libwrap
      - --disable-resolve
    sources:
      - type: archive
        url: http://www.dest-unreach.org/socat/download/socat-1.8.1.3.tar.gz
        sha256: 06602ffd591e98c75b3dc1d66f0f19136cc666b0b2d95caad987d6ab2cb28097
        x-checker-data:
          type: anitya
          project-id: 4848
          url-template: http://www.dest-unreach.org/socat/download/socat-$version.tar.gz
    cleanup:
      - /bin/*.sh
      - /bin/filan
      - /bin/procan
      - /share/man

  - name: discord
    buildsystem: simple
    build-options:
      # Some Discord binary modules ship with debug symbols, make sure not to touch them.
      no-debuginfo: true
      strip: false
    build-commands:
      - mkdir -p /app/discord-canary/modules
      # Extract the main Discord application
      - brotli -cd discord_full.tar.br | tar xf - -C /app/discord-canary --strip-components
        1
      # Extract Discord modules
      - |
        set -euo pipefail
        for module in *_module.tar.br; do
          target_dir=/app/discord-canary/modules/${module%_*}
          mkdir -p $target_dir
          brotli -cdv -- $module | tar -xf - -C $target_dir --strip-components 1
        done
      - install -Dm755 discord-canary.sh /app/bin/com.discordapp.DiscordCanary
      - install -Dm755 disable-breaking-updates.py /app/bin
      - install -Dm644 DiscordCanary/discord-canary.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 com.discordapp.DiscordCanary.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 com.discordapp.DiscordCanary.metainfo.xml /app/share/appdata/${FLATPAK_ID}.metainfo.xml
    post-install:
      # HACK: Krisp fails to initialize if this directory is not present (or if can't be created). Logs:
      #       MediaEngineStore] Failed to load Krisp module: Failed to setup Krisp module, error code: -4
      #       [AVError] AV error reported: noise-canceller-error {"underlyingError":"NoiseCancellerError.KRISP_INIT_ERROR_GLOBAL_INIT"}
      - mkdir -p /app/discord-canary/modules/discord_krisp/KMS/logs
      # HACK: Set the newUpdater key to false in build_info.json in order to disable the new Discord updater (released on 2026-05-04, version 1.0.136),
      #       Also add a localModulesRoot key that points to the Discord modules we're packaging.
      - |
        set -e
        jq '.newUpdater = false | .localModulesRoot = "/app/discord-canary/modules"' /app/discord-canary/resources/build_info.json > tmp.json
        mv tmp.json /app/discord-canary/resources/build_info.json
      # HACK: MediaPipe (video backgrounds / selfie segmentation) opens discord_voice *.tflite
      #       models with O_RDWR. /app is mounted read-only, so the open fails with EACCES and the
      #       camera goes black (see https://github.com/flathub/com.discordapp.Discord/issues/650).
      #       Flatpak cannot ship files into the per-user writable tree at build time (/var/data is
      #       created empty at runtime), so stash the real models under /app and replace them in the
      #       module dir with symlinks to /var/data/mediapipe_models; discord.sh copies the stash
      #       there on launch. Globbing *.tflite picks up any models Discord adds later.
      - |
        set -eu
        voice=/app/discord-canary/modules/discord_voice
        store=/app/discord-canary/mediapipe_models
        # /var/data is Flatpak's alias for $XDG_DATA_HOME; keep an absolute path in the symlink.
        writable=/var/data/mediapipe_models
        mkdir -p "${store}"
        for model in "${voice}"/*.tflite; do
          name=${model##*/}
          mv -f "${model}" "${store}/${name}"
          ln -sfn "${writable}/${name}" "${voice}/${name}"
        done
      # HACK: Patch Discord's app.asar to fix the desktop filename to avoid window association issues, as recommended by the Flatpak documentation:
      #       https://docs.flatpak.org/en/latest/electron.html#using-correct-desktop-file-name
      - patch-electron-desktop-filename /app/discord-canary/resources/app.asar
      - desktop-file-edit --add-mime-type=x-scheme-handler/discord /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key=Exec --set-value='com.discordapp.DiscordCanary
        %U' /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key=Icon --set-value=com.discordapp.DiscordCanary
        /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --remove-key=Path /app/share/applications/${FLATPAK_ID}.desktop
    sources:
      - type: file
        dest-filename: discord_full.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1876/full.distro
        sha256: 8f6aa521d677cceda1d9ccff0ca05c0eca866ddcf94e4030fa7a8471650454d7
        x-checker-data:
          type: json
          url: https://discord.com/api/updates/canary?platform=linux
          version-query: .name
          timestamp-query: .pub_date
          url-query: '"https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/\($version)/full.distro"'
          is-main-source: true
      - type: archive
        dest-filename: discord_bootstrap.tar.gz
        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1876/discord-canary-1.0.1876.tar.gz
        sha256: 4e816a26a3a77ba16354dcc7e0dff28356bb4d5cc9b7ef04d87304dd5ea1f644
        x-checker-data:

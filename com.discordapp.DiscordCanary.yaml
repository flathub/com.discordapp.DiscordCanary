      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1389/discord_desktop_core/1/full.distro
        sha256: 6c74bb3fc23680aa343a031ecd3e336d06298eb6050bbadb43b55428b61ed20d
        x-checker-data:

          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1363/discord_desktop_core/1/full.distro
        sha256: 3e462c9b3b2e79a934e8580cd322e9e0aedb78cf85d699e2177de693ee958794
        x-checker-data:

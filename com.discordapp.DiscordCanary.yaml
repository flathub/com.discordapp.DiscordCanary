        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2478/discord_desktop_core/1/full.distro
        sha256: 870b24f6dbd5db7396ad32a2bef772f39c0edf98cdae28307c7bec430c45ba4f
        x-checker-data:

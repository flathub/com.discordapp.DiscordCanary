        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1956/discord_desktop_core/1/full.distro
        sha256: 68472afd4b13902a371a0aa1290f6ef71165442d7a502b2fc1e214107beade7e
        x-checker-data:

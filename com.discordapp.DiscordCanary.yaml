      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1322/discord_desktop_core/1/full.distro
        sha256: f7203abcdc70ebabd8e5eb370b5d2aa7ca295519a7bc7d29286f0a69e27a00f5
        x-checker-data:
          type: json

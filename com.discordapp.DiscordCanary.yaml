        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1864/discord_desktop_core/1/full.distro
        sha256: e59e404a9458884be71092ff6da63ca6f9746e9a67ee5f229ec73f4c342d7ff0

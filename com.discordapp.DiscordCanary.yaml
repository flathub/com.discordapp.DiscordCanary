          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1261/discord_desktop_core/1/full.distro
        sha256: 894fb420cdd88a42f95335f74d97ece3c9085e0425d95ea9d6e2b998115634af
        x-checker-data:

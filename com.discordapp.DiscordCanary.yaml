        url: https://dl-canary.discordapp.net/apps/linux/1.0.1780/discord-canary-1.0.1780.tar.gz
        sha256: 095ea81072936381546aa8a64b5ca5e216eef873aaba828059805f793fdce87a
        x-checker-data:

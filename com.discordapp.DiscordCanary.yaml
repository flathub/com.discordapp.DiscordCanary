        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2500/discord_desktop_core/1/full.distro
        sha256: 28af020c54081fa27e048cbc9fe4228b8ad9541bc76c59d049f20101f997fd79
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1895/discord_desktop_core/1/full.distro
        sha256: 6638f070d3efd834aa1d5f02fd41a4ab20b125111cf2886ccb6531b3ee4dc585

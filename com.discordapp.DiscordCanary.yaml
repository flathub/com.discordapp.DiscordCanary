        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1833/discord_desktop_core/1/full.distro
        sha256: 66d84c370f4bbe17ad9c48bc5f475d4b7d4804d549c03b04d48e80954b9e16cf

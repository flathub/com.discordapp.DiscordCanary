      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1437/discord_desktop_core/1/full.distro
        sha256: 3cc01300ff41a1640fc1fcc308e2ead25f7d0fd630cd6b92f0a31a441fbd01c9
        x-checker-data:

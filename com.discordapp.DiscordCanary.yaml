      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1662/discord_desktop_core/1/full.distro
        sha256: e6f0f3cfcf32c2d6a22bb8a1d0d171297915eba4320435f3ea22047e62770907

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1497/discord_desktop_core/1/full.distro
        sha256: a2a8556be9d7a5ef92ac1e6b709ecad2308bb62f266c5a2e0ad4338db2ec4771
        x-checker-data:

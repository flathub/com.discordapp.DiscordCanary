      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1395/discord_desktop_core/1/full.distro
        sha256: 619357761dd5dabb1bdab43742264d5380f344b653be7b0aa4e679e53a92126e
        x-checker-data:

        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1807/discord-canary-1.0.1807.tar.gz
        sha256: 65f7b161b8fdb597f8a1645bb384c0c4cdd9e312b4c46f8ad24f130122443591
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1575/discord_desktop_core/1/full.distro
        sha256: b4dd5b81f11dadc3d4c2b474a6fd3a62eed78e98a77b2fdeb4eadf267ca848f8

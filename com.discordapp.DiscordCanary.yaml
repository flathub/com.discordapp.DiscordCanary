        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1819/discord_desktop_core/1/full.distro
        sha256: 60583d565ccec202f9001808ce83bc73a8c5dea3f7cf8df30461979d85854e5d
        x-checker-data:

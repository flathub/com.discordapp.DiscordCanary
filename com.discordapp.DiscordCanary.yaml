        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1447/discord_desktop_core/1/full.distro
        sha256: f28ad5b68ab793c877303b54b63d533bb919c78f19801a1d6dbab594a0ec4e3b
        x-checker-data:

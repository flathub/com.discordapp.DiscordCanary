      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1598/discord_desktop_core/1/full.distro
        sha256: dfde3cb89dba23ef0baa7aafbeec79ec38421439359851caacaa711f4e2d3df1
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1744/discord_desktop_core/1/full.distro
        sha256: 64dd11f142ab2390c7cdc08d5239992dcbbc0cc0e8bdabf0c91bb579821adf39

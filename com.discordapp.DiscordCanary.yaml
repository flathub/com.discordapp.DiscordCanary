        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1859/discord-canary-1.0.1859.tar.gz
        sha256: f820f7465803262797b10851bf94ed5ca77aca3f340a95d81ba2c480e84927a4
        x-checker-data:

          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1198/discord_desktop_core/1/full.distro
        sha256: cec701aa075b9fb93e1f405963768c7e3b4489b81553e7f8c805a1992b4d4a19
        x-checker-data:

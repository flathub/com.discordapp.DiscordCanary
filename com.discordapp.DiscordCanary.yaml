        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1803/discord_desktop_core/1/full.distro
        sha256: 8e571e107908b9033b67e22c6680d8594d4bcf187cf2ae96f53154bdedf07de3
        x-checker-data:

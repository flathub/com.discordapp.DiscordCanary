        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1854/discord_desktop_core/1/full.distro
        sha256: 22a5a6bc223b2cdf26474b555a05f26e51e48612e96440dac4c0eaa0e4676f8f
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1298/discord_desktop_core/1/full.distro
        sha256: 719631fde5a734b3def51ff7fb4150c4d8d76e247648b1ff2c2b299a01767e42
        x-checker-data:

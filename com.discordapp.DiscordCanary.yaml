        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1864/discord-canary-1.0.1864.tar.gz
        sha256: 628ee7f2f289776c411ee8e4e8d911f9c9112e7e94058bbc4fc0e7bc8b8aa688
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1337/discord_desktop_core/1/full.distro
        sha256: a0ae66f4c52fe0895b7f69537d63eb7d79e2402b9315b4557c1d90a033ec7e84
        x-checker-data:

          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1683/discord_desktop_core/1/full.distro
        sha256: ae8b40e58d87d43889b044e82b030c0f5fd6719205203f16c081a21728cfe45c
        x-checker-data:

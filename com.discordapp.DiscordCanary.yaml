        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2075/discord_desktop_core/1/full.distro
        sha256: 6a2f764722b9ad11d62b4c9c7eef391498f08758d4002f7239bcf8c0205a6df2

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1900/discord_desktop_core/1/full.distro
        sha256: b09db1af953595ed83167583d8cf51b95f43c8bbb119a8d248eef83b7729e79b
        x-checker-data:

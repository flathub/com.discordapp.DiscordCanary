      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1695/discord_desktop_core/1/full.distro
        sha256: abbe0cecb3751354bdc3ccd01bf4fd31b69f08028d763779b32619a146e43f31
        x-checker-data:

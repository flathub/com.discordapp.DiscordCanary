      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1250/discord_desktop_core/1/full.distro
        sha256: d4c164c0300fa966df1dc532f2df31be5efd84170004ec8c87d97183b595e73c
        x-checker-data:

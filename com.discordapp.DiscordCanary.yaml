        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2285/discord_desktop_core/1/full.distro
        sha256: 18dd75e505cd767c0760832271959228b93530ce9462447b91ae5661e5656cd0
        x-checker-data:

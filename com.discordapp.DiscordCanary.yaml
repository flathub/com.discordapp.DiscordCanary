        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1836/discord-canary-1.0.1836.tar.gz
        sha256: e46f4bc55e6dc70a9e81cc2a656279074b4c0d4cbebdc8fc37664a7cbac3b081

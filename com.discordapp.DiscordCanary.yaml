      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1207/discord_desktop_core/1/full.distro
        sha256: 26770661c747bbb195d7f46b62b15a9d52b35a3ee8db2a0c01518c06679ef1f4
        x-checker-data:

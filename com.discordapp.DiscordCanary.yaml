        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1618/discord_desktop_core/1/full.distro
        sha256: efa5af03a63743e2d2dda92320c768eca2e21e7100ed3cebd768a662d84cdcf6
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1410/discord_desktop_core/1/full.distro
        sha256: 32092b83639d93b92c2594e774aafbd494eca266bc16ef127996580ac5bba1ba
        x-checker-data:
          type: json

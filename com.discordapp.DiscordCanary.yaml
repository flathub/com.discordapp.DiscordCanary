        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1795/discord-canary-1.0.1795.tar.gz
        sha256: 8d45fd193345e737072d931488ff12a72bc66b2493c193a59d6f5ba422ac5434
        x-checker-data:

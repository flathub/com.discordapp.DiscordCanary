      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1522/discord_desktop_core/1/full.distro
        sha256: e829a704bb3ee8fcc61b2e1f5032262c0896dfd859eb4cf2ccd291580f812e5c
        x-checker-data:

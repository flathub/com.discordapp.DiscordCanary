          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1435/discord_desktop_core/1/full.distro
        sha256: 839263b5e850b2c5ce6320f482d8828f6b9c47e28b8f147bd25765634a6f55f0
        x-checker-data:

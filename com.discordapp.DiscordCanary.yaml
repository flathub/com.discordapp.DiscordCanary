        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.2344/discord-canary-1.0.2344.tar.gz
        sha256: 20653ca652f8beed4d31346b8565d41dd1aa0b71c79424d3dff5107a1a7d5ba1
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1795/discord_desktop_core/1/full.distro
        sha256: 5ca6b3f2a561cd80d891c80abd10d8e78c06419bc3fd31c6f5ec0f7a93f21f1e

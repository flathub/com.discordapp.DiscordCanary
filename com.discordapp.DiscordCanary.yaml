        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.2483/discord-canary-1.0.2483.tar.gz
        sha256: f84f936517101b8a4ba3e4c3ea8ffad917bc9254dbb18e63d664dd799de0c085
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1594/discord_desktop_core/1/full.distro
        sha256: 4e7069068f2c52d6e1d84c05b26d5960fab4834b9f5bf957dee0b9574d86b638
        x-checker-data:

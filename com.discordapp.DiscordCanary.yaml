        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1468/discord_desktop_core/1/full.distro
        sha256: ac7f3364ac41142f0c0882c521a8b9581f8c789ab2bd5947b8d83b5a8255693b
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1413/discord_desktop_core/1/full.distro
        sha256: fd0600957efc25f11d481c46d9f154fb7031fb71ad914da0bac4c2fe7e9573a3
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1669/discord_desktop_core/1/full.distro
        sha256: 1bffd2312e9fa6c80cbb9e96e44818a4cd4d7fdbf8c3d68c13a63d00218cc991
        x-checker-data:

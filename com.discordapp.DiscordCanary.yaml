          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1154/discord_desktop_core/1/full.distro
        sha256: 1a9fd4b9a946f2d2208438d59bb18651ebe860b2cacd80e551338857d755bb40
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2174/discord_desktop_core/1/full.distro
        sha256: 0c2c8be5ada579b2b030143f5aa0323bc9ed7c06396afe7ac90f38dec8e89765

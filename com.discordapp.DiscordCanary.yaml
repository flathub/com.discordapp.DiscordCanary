          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1701/discord_desktop_core/1/full.distro
        sha256: 786eaf54bc803319258abc57aa7dd0f53f1ec46a2af9faad88898f4fdf7c041c
        x-checker-data:

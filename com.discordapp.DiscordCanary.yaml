        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1417/discord_desktop_core/1/full.distro
        sha256: d12a0dcfd960c5d340f25bceadb1d577fdea15650b9e848a9c00e65a1f5717bd
        x-checker-data:

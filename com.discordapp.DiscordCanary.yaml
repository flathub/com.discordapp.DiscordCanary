      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1572/discord_desktop_core/1/full.distro
        sha256: c5c779b66dc66e82d37eb61fc8625e5022c0b9a9bfa0331004f2e3deb4da314c
        x-checker-data:

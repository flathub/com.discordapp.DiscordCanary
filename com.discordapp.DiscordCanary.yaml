      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1543/discord_desktop_core/1/full.distro
        sha256: 14550283909861b81d414d3d8a5af17d51c237d409d3bc9e2af4aa6ae147a5b1
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1884/discord_desktop_core/1/full.distro
        sha256: f22fadfa2fd82ae65f415d93439011e44a53ac0b440f7746c0def2bfdbe07763

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1831/discord_desktop_core/1/full.distro
        sha256: f57f3776b9243cd1084421f058695971a6eb22bf68c40a71350e7931f7f8bfd1
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2017/discord_desktop_core/1/full.distro
        sha256: fa17d86b66e23ab91c42afc7dfbe8fcc30235391cd724adb66fcf6bc42636c73
        x-checker-data:

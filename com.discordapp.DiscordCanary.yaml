        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1886/discord_desktop_core/1/full.distro
        sha256: b06c59ada34b5f4742f0a8f5a3cc6c19bebe17ee03275ab2e126692a4b4a34fd
        x-checker-data:

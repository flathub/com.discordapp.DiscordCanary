      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1374/discord_desktop_core/1/full.distro
        sha256: 064767ad08f73bd71b88f65d7500ac4d4cb478707441241291e8a26438021f1b
        x-checker-data:

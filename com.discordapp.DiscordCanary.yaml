        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1876/discord_desktop_core/1/full.distro
        sha256: 109d218153e02375d09eb2fb7d3858435b8e86e69aa027494e56e72b24523808
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2033/discord_desktop_core/1/full.distro
        sha256: 1ae85d79ffde50dca3cf869718763b5fddeb1d1b95f5318d0e366c2d9b71dbc0

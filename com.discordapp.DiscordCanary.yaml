        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1684/discord_desktop_core/1/full.distro
        sha256: 09809d47097c9dffade5be202c6fd338cbb6171dc788c0d70b36c049901d8070
        x-checker-data:

        url: https://dl-canary.discordapp.net/apps/linux/1.0.1833/discord-canary-1.0.1833.tar.gz
        sha256: be9d619403bc37940cca0ec8cb4b01753206a3033a07f1285a596cc23080f010
        x-checker-data:

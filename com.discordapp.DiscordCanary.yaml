        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1838/discord-canary-1.0.1838.tar.gz
        sha256: 13357b1a48c16562bc0da69098bc0500ddf3517b30299c85ca52f523f37aacab
        x-checker-data:

          version-query: .name
          url-query: '"https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/\($version)/discord_desktop_core/1/full.distro"'
      # TODO: Figure out a way to properly check for updates for each Discord module listed below.
      - type: file

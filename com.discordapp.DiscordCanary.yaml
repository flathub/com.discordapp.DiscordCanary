      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1293/discord_desktop_core/1/full.distro
        sha256: 8edb586649128d0f06eacf1ec6f91c15db9774f0fb0328289013b312c02920b7
        x-checker-data:

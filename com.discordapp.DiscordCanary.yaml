        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1715/discord-canary-1.0.1715.tar.gz
        sha256: 2e9abcdeb7c2279fae64e752398dd1a7a42edcb82b983fadf70c7455a7777f67
        x-checker-data:

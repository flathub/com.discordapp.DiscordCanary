      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1289/discord_desktop_core/1/full.distro
        sha256: 3792f405cb036fd7b76c2879715841270b51d06d4ae2afa77ca0fa3e29cf823c
        x-checker-data:

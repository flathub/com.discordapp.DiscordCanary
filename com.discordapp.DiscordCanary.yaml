        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1897/discord_desktop_core/1/full.distro
        sha256: b86577557844d14dc73aff376f9bdf19dcc07849e28f62f672b24044fb1d3095

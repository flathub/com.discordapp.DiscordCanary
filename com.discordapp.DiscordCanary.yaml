        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1859/discord_desktop_core/1/full.distro
        sha256: 2135fad2d8f3c38014affc8ce804287f3a60be36ad78457e648381093e40294a

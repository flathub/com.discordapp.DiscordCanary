        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1844/discord-canary-1.0.1844.tar.gz
        sha256: 213f76c719ed9e44a62bf08ce5edb25f883ad51e540dae879d6a2b7c479c095c
        x-checker-data:

        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1809/discord-canary-1.0.1809.tar.gz
        sha256: 5ec77597eb027a606fd136a23481aa75d1a16a041e1df49e7accdd7ef9b7e314
        x-checker-data:

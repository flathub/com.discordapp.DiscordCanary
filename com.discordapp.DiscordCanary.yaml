      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1334/discord_desktop_core/1/full.distro
        sha256: 5b40cc49adba208625f0abb6e9a979bd789f1d7e44fd79c40b51c9822de56989
        x-checker-data:

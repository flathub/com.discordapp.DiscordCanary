        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.2271/discord-canary-1.0.2271.tar.gz
        sha256: 69df4829f478fc4862885e27682b60b02a1b4ee357dd3cce4df16d133af337e7
        x-checker-data:

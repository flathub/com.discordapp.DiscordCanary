        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1837/discord_desktop_core/1/full.distro
        sha256: 06dc7398a51540126da3bd75830b3501118df36d5315159a0b59e9f9f877fc55
        x-checker-data:

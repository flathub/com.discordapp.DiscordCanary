          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1552/discord_desktop_core/1/full.distro
        sha256: e1709383de065db5a3387ea0db65960d83bf0f5e6be1df658a1dc7d1e7d7d349
        x-checker-data:

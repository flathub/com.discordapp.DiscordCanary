        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.2033/discord-canary-1.0.2033.tar.gz
        sha256: e85750a2a3658f2dc9bf2dfe44d76852e0b5d5b443ee8b4269e325e938f55b48
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1743/discord_desktop_core/1/full.distro
        sha256: 4fd46cc41a6144bddc5b2d8a307a0d46c4fb1ef923732eb3b56774e8f9e900e9
        x-checker-data:

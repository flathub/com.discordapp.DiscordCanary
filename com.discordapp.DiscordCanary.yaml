        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1351/discord_desktop_core/1/full.distro
        sha256: 3095b6c87057517439342c39b7ad0e7a0a908c0762f5c1ebecc039da58498677
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1682/discord_desktop_core/1/full.distro
        sha256: 3f4c914482f9880d395fcd676154abe884de1ccca06bbd8c63b0fbd4528869cb
        x-checker-data:

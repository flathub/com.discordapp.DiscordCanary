          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1161/discord_desktop_core/1/full.distro
        sha256: ce7a4273378fd10c450f210e07bc2210740cd0651b5946c05de6f6be3271004f
        x-checker-data:
          type: json

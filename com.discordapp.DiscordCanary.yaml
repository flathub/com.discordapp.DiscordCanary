        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1608/discord_desktop_core/1/full.distro
        sha256: 78a2b62b70907336b5ec778ea707c60994f505fc6175be2883470140e6a0305d
        x-checker-data:

        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1761/discord-canary-1.0.1761.tar.gz
        sha256: aa136c11c8754ab405ccffe864ac21f8f83ca7e1a3d0b3908f35926c515a2e72
        x-checker-data:

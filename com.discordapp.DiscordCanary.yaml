        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1224/discord_desktop_core/1/full.distro
        sha256: fa2169992a82116e2fe9e1a9669b7d36cb338413ea708bdbfbd4f8523da2f67a
        x-checker-data:
          type: json

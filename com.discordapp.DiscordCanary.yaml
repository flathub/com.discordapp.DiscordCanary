        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2271/discord_desktop_core/1/full.distro
        sha256: a5d267e0a6678e34d8828ce27cd562a768e5d0da97606a2ab95667706afc587b
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1569/discord_desktop_core/1/full.distro
        sha256: 85325071ac5c7ccd0990524420cb3fcc38470bf8f094dd89bb184fa31e7aa0cc
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1656/discord_desktop_core/1/full.distro
        sha256: 6c63801b881712be6261a6144215ab83011e4d40a477859e95676bf4f0f7f7e1
        x-checker-data:

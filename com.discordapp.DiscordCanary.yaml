        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1775/discord_desktop_core/1/full.distro
        sha256: 199127aacfdfa41cf2cfdf86ca6dfec6284fbe6c345c67e24b7266b35cc4a9a4
        x-checker-data:

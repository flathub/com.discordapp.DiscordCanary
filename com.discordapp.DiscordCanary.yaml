        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1871/discord-canary-1.0.1871.tar.gz
        sha256: 472e24e0481ab12b7587d7f4e7f89b73b88ed4ec8f727773a01c822954c25663
        x-checker-data:

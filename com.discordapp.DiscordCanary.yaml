        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1736/discord-canary-1.0.1736.tar.gz
        sha256: 4926680e1238f5307b0f07fb611caa39ac3bcf98ba05d9e28e11c717fd3bcd50

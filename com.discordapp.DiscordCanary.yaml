          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1406/discord_desktop_core/1/full.distro
        sha256: 5043bf3790a2138d5150a12d5155a1c654f8e353524b018569b99ad51118eb67
        x-checker-data:
          type: json

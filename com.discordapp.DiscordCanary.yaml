      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1442/discord_desktop_core/1/full.distro
        sha256: 5bf800037dc1b9551348202743345d673bd220d161ce1000b37610141c14d225
        x-checker-data:

          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1230/discord_desktop_core/1/full.distro
        sha256: 05f6d09c131db4487eda6bfac02126a544a9ea801bc099a00d96b0cd81b1e8cd
        x-checker-data:
          type: json

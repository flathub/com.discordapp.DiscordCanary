        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2248/discord_desktop_core/1/full.distro
        sha256: 0b2bf84d15563e7e3992fd2dcd8b0f085ebcdd2dbdbfc774e90ece2d8edc5870
        x-checker-data:

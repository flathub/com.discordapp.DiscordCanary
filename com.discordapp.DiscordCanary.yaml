        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1871/discord_desktop_core/1/full.distro
        sha256: ca720288f0bd5ee122b5a1c6e2e2635acab4bc41c28b9b5da6a2231d69104832

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1483/discord_desktop_core/1/full.distro
        sha256: b31425934951fb606e001eaf85c6e710893f29ded83ea38d2a34289b089a4c30
        x-checker-data:

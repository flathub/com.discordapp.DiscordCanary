        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1700/discord_desktop_core/1/full.distro
        sha256: bee8a589aa0a022bab8f936780c31462b8227b5a335442ed0ed484ecb16118b0
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1202/discord_desktop_core/1/full.distro
        sha256: bec1f8a6b9454628e01552ffb1c43342411bb0063691ec44e343997b86886fa0
        x-checker-data:

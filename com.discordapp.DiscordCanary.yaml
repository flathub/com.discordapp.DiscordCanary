        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1628/discord_desktop_core/1/full.distro
        sha256: ce0b7b41d22fc0c5c113e48bb7af7f80033f32c432c9aa64dc34bf4bd8fd524d

        strip-components: 0
        url: https://dl-canary.discordapp.net/apps/linux/1.0.1782/discord-canary-1.0.1782.tar.gz
        sha256: d204150601ace53183a616cb046e0657d7104f04b0276be58e5a72003d613b60
        x-checker-data:

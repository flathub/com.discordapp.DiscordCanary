      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1365/discord_desktop_core/1/full.distro
        sha256: aaa065b52fe0e0644d696dd9020f761311ee789c2e32f835e92254a0cb6aa130
        x-checker-data:
          type: json

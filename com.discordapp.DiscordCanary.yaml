        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1791/discord_desktop_core/1/full.distro
        sha256: 474c3a7de8ac1017f80c6d76f1afcefcc8370556915300f310712e00dd1ad092

          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1317/discord_desktop_core/1/full.distro
        sha256: 3dfc8d59c63ca57155d2298dc0c3035fd732f2725b89bff80b1a0bc5cae7287a
        x-checker-data:
          type: json
          url: https://discord.com/api/updates/canary?platform=linux

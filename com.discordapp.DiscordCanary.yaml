        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1844/discord_desktop_core/1/full.distro
        sha256: c9fe327d09390d37ce43a217b15509866511e1bc096faaa0832b621e9095c5a9

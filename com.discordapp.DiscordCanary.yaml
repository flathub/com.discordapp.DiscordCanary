        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1966/discord_desktop_core/1/full.distro
        sha256: 7b96c28c7bcdf73d976a8a616b610c16cb3915ca358ec673aa3e3495cb31c4c3
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1472/discord_desktop_core/1/full.distro
        sha256: 9bf05df334fc08464be8f8c4a5846e460d097068ebdb867688b69ec96fd6272f
        x-checker-data:

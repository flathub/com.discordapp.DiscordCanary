        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1560/discord_desktop_core/1/full.distro
        sha256: d2e80af5475efe047c411c38cb307e4cba5858f626a17292fe747068166dc455
        x-checker-data:

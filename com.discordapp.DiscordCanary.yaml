        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1836/discord_desktop_core/1/full.distro
        sha256: 818105fd922952698759f57f47f508e27b3a77dd8e1009839dbfb9ab16747ef0

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1192/discord_desktop_core/1/full.distro
        sha256: c39b739b14fb3a080056cb5a0f5eb37a3fc84c457c0e0319dc1d6f6be8d79a6d
        x-checker-data:

          url-query: '"https://dl-canary.discordapp.net/apps/linux/\($version)/discord-canary-\($version).tar.gz"'
      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1143/discord_desktop_core/1/full.distro
        sha256: ee0495e30bba2e8db226e57acf2741538dc8afbd33cfd39f0f3e53c87d34b572
        x-checker-data:

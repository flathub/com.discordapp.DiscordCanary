        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1668/discord_desktop_core/1/full.distro
        sha256: 821825defad857e685e6244954d873f49752cd6972e99193cad986100849a049
        x-checker-data:

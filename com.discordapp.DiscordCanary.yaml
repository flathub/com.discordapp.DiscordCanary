        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1774/discord_desktop_core/1/full.distro
        sha256: a8f80222a7a84afd7b7549b6c7b78b7cd27ac028e379b19f27cd6fb77bf67ecf
        x-checker-data:

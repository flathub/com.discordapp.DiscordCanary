      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1692/discord_desktop_core/1/full.distro
        sha256: 4cee60e5ba69a68503f8f6629c3a139943a79afcb81454823039ef27cab552bc
        x-checker-data:

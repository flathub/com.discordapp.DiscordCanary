        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1809/discord_desktop_core/1/full.distro
        sha256: ca28301f7632c51bd730bc48e366761cde5a78b3f33f432d89e8b24827062246
        x-checker-data:

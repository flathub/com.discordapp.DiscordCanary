        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1845/discord_desktop_core/1/full.distro
        sha256: e00edd4fb840353a17f2046b772d1857bcb873b58196f9c6c5fb644637c90300
        x-checker-data:

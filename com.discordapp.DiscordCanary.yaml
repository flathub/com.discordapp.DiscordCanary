        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2344/discord_desktop_core/1/full.distro
        sha256: e4d81aa66c3b94bf4c2bbcd5827903d68c717a3542775f88de7cbc3ef1993c70
        x-checker-data:

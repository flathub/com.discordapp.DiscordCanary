        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1702/discord_desktop_core/1/full.distro
        sha256: 25ae36134ded8cbfe3ee4fdfb6263bace2db9a6bfa982898aece30a0ccb0c604
        x-checker-data:

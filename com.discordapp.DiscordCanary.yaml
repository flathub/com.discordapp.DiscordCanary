        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.2010/discord_desktop_core/1/full.distro
        sha256: a120924d8fd2de31db4b36fd118b6caa609baca42f0936c1ed677eaaf6c3385e
        x-checker-data:

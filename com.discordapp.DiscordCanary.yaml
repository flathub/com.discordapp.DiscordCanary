      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1531/discord_desktop_core/1/full.distro
        sha256: 40b09303ed944eaaa628da49e088a5369be9501ece786ce0ee098c992fec9d7c
        x-checker-data:

      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1573/discord_desktop_core/1/full.distro
        sha256: d45ed48277a1d10e4768750ec6b62d0a0bb0c46f41c1bcc795da170cf4dfe282
        x-checker-data:

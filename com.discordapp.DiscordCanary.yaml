      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1382/discord_desktop_core/1/full.distro
        sha256: 346ca670a8e7fd2f57dcd3f94477e7a1229b74ad9d4410442d8ecfbe2c5f7bc5
        x-checker-data:

        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1704/discord_desktop_core/1/full.distro
        sha256: cac02356cb04afe784ebd0c751c8574e3f91c9521ee9626f4aef1e913e32fe79
        x-checker-data:

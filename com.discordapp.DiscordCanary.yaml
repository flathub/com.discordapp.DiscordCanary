        url: https://dl-canary.discordapp.net/apps/linux/1.0.1897/discord-canary-1.0.1897.tar.gz
        sha256: 1d34f9b747e091a42c3bb0449f0d1e85b6649492e4b36c95b7194b83a84a4710
        x-checker-data:

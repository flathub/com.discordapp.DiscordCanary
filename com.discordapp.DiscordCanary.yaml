      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1425/discord_desktop_core/1/full.distro
        sha256: 84b046e6c36dad31f17d61d7fe05bf396b5f284e7964fdd38479cda3e99d20db
        x-checker-data:

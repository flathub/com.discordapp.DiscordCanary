        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1715/discord_desktop_core/1/full.distro
        sha256: e8812f252065ed99457c7e9a7bc5ca6242bad7f1ddee9c588b17afbe91fd1ee9

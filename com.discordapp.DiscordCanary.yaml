      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1184/discord_desktop_core/1/full.distro
        sha256: d895b82fe72d03afb49508a32d013ab8ed1c459dccbfb53faba2066862973115
        x-checker-data:

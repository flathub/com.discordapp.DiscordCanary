      - type: file
        dest-filename: discord_desktop_core_module.tar.br
        url: https://canary.dl2.discordapp.net/distro/app/canary/linux/x64/1.0.1350/discord_desktop_core/1/full.distro
        sha256: 743f602b6b2f1471ab813a5b33eb6da88aa44e962e17df1708f1cbeea92793ae
        x-checker-data:
